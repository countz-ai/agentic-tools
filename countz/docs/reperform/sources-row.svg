<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="Arial, Helvetica, sans-serif">
  <rect width="880" height="400" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="18" font-weight="bold" fill="#1F2933">One row of the Sources tab</text>
  <text x="24" y="56" font-size="13" fill="#52606D">Every number with an id has one. Shown top to bottom here; on the tab it is one row.</text>

  <g font-size="12" font-weight="bold" fill="#FFFFFF">
    <rect x="24" y="76" width="150" height="300" fill="#0A5F6A"/>
    <text x="36" y="100">id</text>
    <text x="36" y="134">label</text>
    <text x="36" y="168">value</text>
    <text x="36" y="202">expression</text>
    <text x="36" y="272">reads</text>
    <text x="36" y="306">root source</text>
    <text x="36" y="346">To reperform</text>
  </g>
  <g font-size="12" fill="#1F2933">
    <rect x="174" y="76" width="490" height="300" fill="#F8FAFC" stroke="#CBD2D9"/>
    <g stroke="#E4E7EB"><line x1="174" y1="116" x2="664" y2="116"/><line x1="174" y1="150" x2="664" y2="150"/><line x1="174" y1="184" x2="664" y2="184"/><line x1="174" y1="252" x2="664" y2="252"/><line x1="174" y1="286" x2="664" y2="286"/><line x1="174" y1="320" x2="664" y2="320"/></g>
    <text x="186" y="100" fill="#0A5F6A" text-decoration="underline">F.m5.presentation.noncurrent.2025-12</text>
    <text x="186" y="131" font-size="11">AJ.presentation.noncurrent: supported asset beyond the next</text>
    <text x="186" y="144" font-size="11">twelve months, 2025-12</text>
    <text x="186" y="168">1,221,656.67</text>
    <text x="186" y="204" font-family="Menlo, Consolas, monospace" font-size="11">SELECT … UNION ALL SELECT … round(sum(noncurrent), 2)</text>
    <text x="186" y="220" font-family="Menlo, Consolas, monospace" font-size="11">FROM m5_amortization.by_portfolio</text>
    <text x="186" y="236" font-family="Menlo, Consolas, monospace" font-size="11">WHERE period IN ('2024-12', '2025-12') GROUP BY period</text>
    <text x="186" y="272" fill="#0A5F6A" text-decoration="underline">m5_amortization.writeoffs</text>
    <text x="380" y="272" fill="#0A5F6A" text-decoration="underline">m5_amortization.by_portfolio</text>
    <text x="186" y="306" fill="#0A5F6A" text-decoration="underline">E.m5_amortization.contract_register</text>
    <text x="440" y="306" fill="#52606D">and 6 more</text>
    <text x="186" y="342">Run the expression over the tables in reads (Tables tab); the row</text>
    <text x="186" y="358">where id = 'F.m5.presentation.noncurrent.2025-12' gives $1,221,656.67.</text>
  </g>
  <g font-size="12" fill="#1F2933">
    <g fill="#B54708"><circle cx="684" cy="164" r="10"/><circle cx="684" cy="218" r="10"/><circle cx="684" cy="268" r="10"/><circle cx="684" cy="302" r="10"/></g>
    <g fill="#FFFFFF" font-weight="bold" text-anchor="middle"><text x="684" y="168">1</text><text x="684" y="222">2</text><text x="684" y="272">3</text><text x="684" y="306">4</text></g>
    <text x="702" y="168">The value in the cell.</text>
    <text x="702" y="214">How it was computed:</text>
    <text x="702" y="230">the logic of this step.</text>
    <text x="702" y="264">What it reads directly.</text>
    <text x="702" y="280">Click to go one level down.</text>
    <text x="702" y="306">Shortcut to the files.</text>
  </g>
</svg>
