<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="Arial, Helvetica, sans-serif">
  <rect width="880" height="470" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="18" font-weight="bold" fill="#1F2933">One row of the Tables tab</text>
  <text x="24" y="56" font-size="13" fill="#52606D">Shown top to bottom here; on the tab it is one row, left to right.</text>

  <!-- header column -->
  <g font-size="12" font-weight="bold" fill="#FFFFFF">
    <rect x="24" y="76" width="150" height="364" fill="#0A5F6A"/>
    <text x="36" y="100">table</text>
    <text x="36" y="140">what one row is</text>
    <text x="36" y="188">made by</text>
    <text x="36" y="222">rows</text>
    <text x="36" y="256">totals</text>
    <text x="36" y="306">result hash</text>
    <text x="36" y="340">SQL</text>
    <text x="36" y="410">reads</text>
  </g>
  <!-- values -->
  <g font-size="12" fill="#1F2933">
    <rect x="174" y="76" width="490" height="364" fill="#F8FAFC" stroke="#CBD2D9"/>
    <g stroke="#E4E7EB"><line x1="174" y1="116" x2="664" y2="116"/><line x1="174" y1="166" x2="664" y2="166"/><line x1="174" y1="200" x2="664" y2="200"/><line x1="174" y1="234" x2="664" y2="234"/><line x1="174" y1="284" x2="664" y2="284"/><line x1="174" y1="318" x2="664" y2="318"/><line x1="174" y1="384" x2="664" y2="384"/></g>
    <text x="186" y="100" fill="#0A5F6A" text-decoration="underline">m5_amortization.by_portfolio</text>
    <text x="186" y="136">One row per portfolio and date: recorded, recomputed,</text>
    <text x="186" y="152">write-offs, closing, current and noncurrent balance.</text>
    <text x="186" y="188" fill="#0A5F6A" text-decoration="underline">m5 Amortization recalculation</text>
    <text x="186" y="222">12</text>
    <text x="186" y="248" font-size="11">recorded 1,848,931.14 · recomputed_term 990,420.23 · …</text>
    <text x="186" y="262" font-size="11">closing 3,059,693.65 · difference 1,210,762.51 ·</text>
    <text x="186" y="276" font-size="11">current_part 934,168.78 · noncurrent 2,125,524.87</text>
    <text x="186" y="306" font-family="Menlo, Consolas, monospace">66d1b3b1e531c280</text>
    <text x="186" y="338" font-family="Menlo, Consolas, monospace" font-size="11">WITH … b AS (SELECT period, portfolio, sum(supported) …</text>
    <text x="186" y="354" font-family="Menlo, Consolas, monospace" font-size="11">FROM m5_amortization.balances GROUP BY ALL) SELECT …</text>
    <text x="186" y="370" font-family="Menlo, Consolas, monospace" font-size="11">supported − written_off − current_part AS noncurrent …</text>
    <text x="186" y="404" fill="#0A5F6A" text-decoration="underline">m5_amortization.balances</text>
    <text x="356" y="404" fill="#0A5F6A" text-decoration="underline">m5_amortization.schedule_lines</text>
    <text x="186" y="424" fill="#0A5F6A" text-decoration="underline">room.dic_schedule_2024</text>
    <text x="356" y="424" fill="#0A5F6A" text-decoration="underline">room.dic_schedule_2025</text>
  </g>
  <!-- callouts -->
  <g font-size="12" fill="#1F2933">
    <g fill="#B54708"><circle cx="684" cy="96" r="10"/><circle cx="684" cy="144" r="10"/><circle cx="684" cy="218" r="10"/><circle cx="684" cy="350" r="10"/><circle cx="684" cy="412" r="10"/></g>
    <g fill="#FFFFFF" font-weight="bold" text-anchor="middle"><text x="684" y="100">1</text><text x="684" y="148">2</text><text x="684" y="222">3</text><text x="684" y="354">4</text><text x="684" y="416">5</text></g>
    <text x="702" y="100">The table's name.</text>
    <text x="702" y="140">Read this first: what</text>
    <text x="702" y="156">a row stands for.</text>
    <text x="702" y="214">Rows, totals and hash:</text>
    <text x="702" y="230">compare your re-run</text>
    <text x="702" y="246">against them.</text>
    <text x="702" y="346">The logic of this step,</text>
    <text x="702" y="362">exactly as it ran.</text>
    <text x="702" y="408">The tables it reads.</text>
    <text x="702" y="424">Click one to go down.</text>
  </g>
</svg>
